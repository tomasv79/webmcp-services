# Publishes the public/ folder to GitHub Pages on every push to main.
# Needs Settings -> Pages -> Source set to "GitHub Actions" once.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits for the running deploy instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pages lets browsers keep a file for ten minutes. The commit in every address keeps a browser from running
      # the new index.html with an old script out of its cache; see scripts/stamp.js.
      - name: Put the commit into the addresses of the page's files
        run: node scripts/stamp.js public "$GITHUB_SHA"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  # A separate job on purpose: deploy-pages looks the uploaded artifact up by name, and right after
  # the upload that lookup can come back empty (actions/deploy-pages#451). The gap between the two
  # jobs gives the artifact time to show up.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
