name: webmcp-services
services:
  web:
    container_name: webmcp-services
    build: .
    image: webmcp-services:local
    ports:
      # Local only. The relay's --widget-origin must list http://localhost:5175.
      - "127.0.0.1:5175:80"
    volumes:
      # Live edits: change a file in ./public and refresh the page.
      - ./public:/usr/share/nginx/html:ro
    restart: unless-stopped
