server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Listing text contains Lithuanian, Latvian and Estonian letters.
    charset utf-8;
    charset_types text/css text/plain application/javascript text/javascript application/json;

    # Set once here; a location block with its own add_header would drop these.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Never serve dotfiles such as .DS_Store.
    location ~ /\. {
        return 404;
    }
}
